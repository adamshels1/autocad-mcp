[project]
name = "autocad-mac-mcp"
version = "0.1.0"
description = "MCP server that drives AutoCAD (Mac and Windows) through AutoLISP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "pywin32>=306; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
autocad-mcp = "autocad_mcp.server:main"
autocad-mcp-selftest = "autocad_mcp.selftest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autocad_mcp"]
